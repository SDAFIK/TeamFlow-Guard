name: TeamFlow validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosting-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t teamflow-hosting .
      - name: Verify missing credentials fail safely
        run: |
          docker run -d --name teamflow-hosting -p 8080:3000 teamflow-hosting
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = '503'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install isolated browser test runtime
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop/mobile Playwright smoke tests (simulated API)
        env:
          NODE_PATH: ${{ github.workspace }}/web/node_modules
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
          TEAMFLOW_BACKEND: supabase
        run: |
          cd web
          npm run start -- -p 3100 >/tmp/teamflow-browser.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/overview >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/teamflow-browser.log
            exit 1
          fi
          cd ..
          node scripts/ux-smoke.cjs
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://teamflow_app:ci-runtime-only@127.0.0.1:5432/teamflow
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-ephemeral-only@127.0.0.1:5432/teamflow
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-ephemeral-only@127.0.0.1:5432/teamflow_test
      DEMO_PASSWORD: ci-fixture-password-only
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.lock.txt
        working-directory: api
      - run: python ci_setup.py
        working-directory: api
      - run: python setup_local.py
        working-directory: api
      - run: python -m pytest -q
        working-directory: api

      - run: python scripts/test-supabase.py
