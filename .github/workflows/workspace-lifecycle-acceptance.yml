          rm -f "$RUNNER_TEMP/stage8-local.env"
      - name: Authenticated workspace lifecycle browser journey
        env:
          NODE_PATH: ${{ github.workspace }}/web/node_modules
          TEAMFLOW_ARTIFACT_DIR: ${{ runner.temp }}/teamflow-lifecycle-evidence
        run: node scripts/workspace-lifecycle-e2e.cjs
      - name: Full product integration acceptance (intercepted external providers)
        env:
