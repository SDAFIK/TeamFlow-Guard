name: Demo migration preparation
on:
  pull_request:
    branches: [codex/workspace-lifecycle-stage1]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npx --yes supabase@2.79.0 migration new isolated_demo_team
          ls -1 supabase/migrations/*_isolated_demo_team.sql
