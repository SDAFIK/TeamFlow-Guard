name: Phase 5B migration scaffold
on:
  push:
    branches: [codex/tic-risk-model]
    paths: ['.github/workflows/phase5b-migration-name.yml']
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate migration filename using Supabase CLI
        run: |
          npx --yes supabase@2.79.0 migration new github_review_evidence
          ls supabase/migrations/*_github_review_evidence.sql
