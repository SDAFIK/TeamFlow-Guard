services:
  - type: web
    name: teamflow-guard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
